services:
  postgres:
    image: postgres:16-alpine
    container_name: codda_postgres
    environment:
      POSTGRES_USER: codda
      POSTGRES_PASSWORD: codda
      POSTGRES_DB: codda
    ports:
      - "5433:5432"
    volumes:
      - codda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codda -d codda"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  codda_pgdata:
